<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Sign in</h1>
    <p class="muted">Use your company email to reach the IT Support Copilot. You can only see your own employee information.</p>
    <form id="loginForm" class="auth-form" autocomplete="on">
      <label for="email">Company email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="loginBtn" type="submit" class="send-btn full">Sign in</button>
      <div id="loginError" class="form-error" role="alert"></div>
    </form>
    {% if demo %}
    <div class="demo-box">
      <div class="demo-divider"><span>or try it without an account</span></div>
      <button id="demoBtn" type="button" class="secondary-btn full-btn">Continue as {{ demo.name }} (demo)</button>
      <p class="muted small">Demo employee in {{ demo.department }}. All data in this app is fictional. You can only see this account's own information.</p>
    </div>
    {% endif %}
  </main>
  <script src="/static/js/login.js"></script>
</body>
</html>
